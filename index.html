<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracing the Pop! Digital Museum</title>
<style>
:root{--ac:#ffd84a}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:"Courier New",monospace}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#game{position:relative;width:min(100vw,calc((100vh - 12px) * 4 / 3),960px);aspect-ratio:4/3;background:#000;border:3px solid #444;border-radius:6px;overflow:hidden}
canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
#hud{position:absolute;top:6px;left:6px;max-width:72%;background:#000;border:2px solid #fff;border-radius:6px;padding:4px 8px;font-size:clamp(10px,1.9vw,15px);display:none}
#dlg{position:absolute;left:2%;right:2%;bottom:3%;background:#000;border:3px solid #fff;border-radius:8px;padding:10px 14px;display:none;font-size:clamp(12px,2.5vw,21px);line-height:1.4}
#nm{color:var(--ac);font-weight:bold;margin-bottom:4px}
#hint{text-align:right;color:var(--ac);display:none}
#ch{position:absolute;right:0;bottom:100%;margin-bottom:10px;display:flex;flex-direction:column;gap:6px;min-width:42%}
#ch button{display:block;width:100%;text-align:left;white-space:pre;background:#000;border:3px solid #fff;color:#fff;font:inherit;padding:6px 12px;cursor:pointer;border-radius:8px}
#ch button::before{content:"  "}
#ch button.sel{border-color:var(--ac);color:var(--ac)}
#ch button.sel::before{content:"▶ "}
#pad{display:none;gap:18px;align-items:center;justify-content:center;user-select:none;touch-action:none}
#pad button{width:56px;height:56px;border-radius:12px;border:2px solid #fff;background:#000;color:#fff;font-size:22px}
#dp{display:grid;grid-template-columns:repeat(3,56px);gap:4px}
@media (pointer:coarse){#pad{display:flex}}
</style>
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>
  <div id="hud"></div>
  <div id="dlg"><div id="nm"></div><div id="tx"></div><div id="ch"></div><div id="hint">▼</div></div>
</div>
<div id="pad">
  <div id="dp"><span></span><button data-k="u">▲</button><span></span><button data-k="l">◀</button><span></span><button data-k="r">▶</button><span></span><button data-k="d">▼</button><span></span></div>
  <button id="abtn">A</button>
</div>

<script>
/* ===== SETUP ===== */
const T=16,VW=20,VH=15,cv=document.getElementById("c"),c=cv.getContext("2d");
cv.width=VW*T;cv.height=VH*T;
const $=id=>document.getElementById(id);
const PALS=[{g:"#62b84a",g2:"#4e9e3a",fl:["#ffffff","#ffd84a","#ff8fb0"],p:"#dcc79a",p2:"#bba879"}];
let PAL=PALS[0];
const SOLID="tblSWNBTHU.OVKPYCXEAGQ";
const V={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
const OPP={u:"d",d:"u",l:"r",r:"l"};

/* ===== MAP BUILDER: ["ch",x,y] = one tile, ["ch",x,y,w,h] = rectangle ===== */
function mk(w,h,base,ops){
  const m=Array.from({length:h},()=>Array(w).fill(base));
  ops.forEach(o=>{
    if(o.length===3){m[o[2]][o[1]]=o[0]}
    else{for(let y=o[2];y<o[2]+o[4];y++)for(let x=o[1];x<o[1]+o[3];x++)m[y][x]=o[0]}
  });
  return m;
}

/* ===== LOOKS ===== */
const L={
  me:{h:"#1c2b5a",s:"#e8b88a",t:"#3a78d8",p:"#5a4a3a",band:1},
  mom:{h:"#3a2418",s:"#e8b88a",t:"#d9577a",p:"#4a3a6a",long:1},
  kidG:{h:"#2a1a12",s:"#c68642",t:"#ff8fb0",p:"#3a4a8a",long:1},
  kidB:{h:"#1a1a1a",s:"#f1c27d",t:"#f2b630",p:"#2a3a6a"},
  lolo:{h:"#d0d0d0",s:"#c68642",t:"#6b8e5a",p:"#5a4a3a"},
  lola:{h:"#d8d8d8",s:"#e8b88a",t:"#9a6ab0",p:"#4a3a4a",long:1},
  ben:{h:"#2a1a12",s:"#f1c27d",t:"#e0e0e0",p:"#2a2a4a"},
  joy:{h:"#4a2a18",s:"#c68642",t:"#3ec0b0",p:"#2a3a5a",long:1},
  mel:{h:"#2a1a12",s:"#e8b88a",t:"#e0533a",p:"#4a3a6a",long:1},
  rosa:{h:"#d8d8d8",s:"#c68642",t:"#c9a0dc",p:"#4a3a4a",long:1},
  rey:{h:"#1a1a1a",s:"#c68642",t:"#2e7d4f",p:"#3a3a3a"},
  c1:{h:"#3a2418",s:"#f1c27d",t:"#e0533a",p:"#2a3a6a"},
  c2:{h:"#1a1a1a",s:"#e8b88a",t:"#8a8a8a",p:"#4a3a2a"}
};

const KS=[["#1a1a1a","#f1c27d","#e0533a","#2a3a6a"],["#4a2a18","#c68642","#3ec0b0","#3a3a3a"],["#2a1a12","#e8b88a","#f2b630","#4a3a6a"],["#3a2418","#f1c27d","#9a6ab0","#2a2a4a"],["#1a1a1a","#c68642","#d9577a","#5a4a3a"]].map(a=>({h:a[0],s:a[1],t:a[2],p:a[3]}));
/* ===== SCENES ===== */
const GO=["I’m not sure, but keep walking and you may find out!"];
const S={};
S.home={pal:0,w:20,h:15,
  m:mk(20,15,".",[["W",3,2,14,10],["F",4,3,12,8],["B",4,3,2,1],["K",7,3],["V",11,3],["A",15,3],["N",6,2],["C",9,2],["Y",11,2],["Y",12,2],["N",14,2],["R",10,4,4,2],["O",11,6,2,1],["E",5,8],["X",6,8,2,1],["E",8,8],["P",4,10],["P",15,8],["M",10,10],["D",9,11]]),
  warps:{"9,11":["hood",3,5,"d"]},
  npcs:[{x:8,y:6,d:"d",l:L.mom,n:"Mom",f:momTalk},
   {x:9,y:2,k:"obj",f:()=>talk("Calendar",["It’s the year 2000. A whole new millennium!"])},
   {x:11,y:3,k:"obj",f:()=>talk("TV",["An old TV with an antenna. Nothing good is on right now."])},
   {x:12,y:2,k:"obj",f:()=>talk("Photo",["A family picture. Everyone is smiling."])},
   {x:6,y:8,k:"obj",f:()=>talk("Phone",["Mom’s Nokia is on the table. It’s almost out of load."])}]};
S.hood={pal:0,w:20,h:15,
  m:mk(20,15,"g",[["t",0,0,20,1],["t",0,14,20,1],["U",1,2,5,1],["H",1,3,5,2],["D",3,4],["p",3,5,1,3],["p",0,7,20,2],
    ["l",6,6],["l",15,6],["b",9,6],["b",9,10],["t",2,10],["t",5,12],["t",16,11],["t",17,3],["t",12,3],["t",8,12]]),
  warps:{"3,4":["home",9,10,"u"]},
  left:"credits",right:"street",
  npcs:[
   {x:6,y:10,d:"r",l:L.kidG,n:"Mia",f:()=>talk("Mia",["Did you hear? Our Lola says people used text messages to gather at EDSA in 2001!","Everyone got a message to go and wear black. Texting is so powerful!"])},
   {x:7,y:10,d:"l",l:L.kidB,n:"Paolo",f:()=>talk("Paolo",["I traded two of my cards for a Pokémon card today!","Now I’m saving my allowance to rent a computer at the internet café."])},
   {x:12,y:6,d:"r",l:L.lolo,n:"Lolo",f:()=>talk("Lolo",["Everyone has a cellphone now. In my day we wrote letters.","Now it’s text, text, text! They even call us the texting capital of the world."])},
   {x:13,y:6,d:"l",l:L.lola,n:"Lola",f:()=>talk("Lola",["Every noon, the whole barangay watches Eat Bulaga! together.","And when Manny Pacquiao fights, the whole street goes quiet!"])}]};
S.street={pal:0,w:20,h:15,
  m:mk(20,15,"g",[["t",0,0,20,1],["t",0,14,20,1],["p",0,6,20,4],["l",4,5],["l",12,5],["l",18,5],["l",8,10],["t",2,11],["t",15,11],["t",6,2],["t",14,2]]),
  left:"hood",right:"block1",
  npcs:[
   {x:7,y:6,d:"d",l:L.ben,n:"Kuya Ben",f:()=>menu("Kuya Ben","What do you think will happen in the future?",[
     {t:"2000s",l:["Right now everybody is texting and renting computers at the internet café. I think that will keep going!"].concat(GO)},
     {t:"2005s",l:["Maybe even more reality shows and foreign dramas on TV. Everyone loves them!"].concat(GO)},
     {t:"2010s",l:["I think by then, everyone will have a touchscreen phone."].concat(GO)},
     {t:"2015s",l:["Maybe we’ll watch shows and chat with our friends on our phones all day."].concat(GO)}])},
   {x:13,y:9,d:"u",l:L.joy,n:"Ate Joy",f:()=>menu("Ate Joy","What do you think will happen in the future?",[
     {t:"2020s",l:["Maybe school and work will happen online? That sounds strange, but who knows."].concat(GO)},
     {t:"2025s",l:["Maybe we’ll pay for everything with our phones. No more coins!"].concat(GO)},
     {t:"2030s",l:["Maybe computers will talk to us and help with everything, like in the movies!"].concat(GO)}])}]};
function kid(x,y,i,line){return {x,y,d:"u",l:KS[i],n:"Kid",f:()=>talk("Kid",[line])}}
const calObj=(x,y,yr,txt)=>({x,y,k:"obj",f:()=>talk("Calendar",["The calendar says "+yr+". "+txt])});
const ROOM=[["W",3,2,14,10],["F",4,3,12,8],["N",6,2],["N",14,2],["D",9,11]];
const storeMenu=()=>menu("Ate Melody","What would you like to know, or buy?",[
  {t:"Buy prepaid load",a:()=>{G.flags.load=1;setGoal("Take the load home to Mom (walk back to the left).")},l:["Here is the prepaid load for your mom.","Prepaid load changed everything. You don’t need a monthly plan to send texts."]},
  {t:"What’s popular right now?",l:["Texting, of course! Promos let people send messages all day.","Phones are status symbols too. Everyone wants the newest Nokia.","In the evenings, people crowd around the TV. Ask Lola Rosa in the house next door!"]},
  {t:"Why is everyone texting?",l:["Calling is expensive, but a text costs much less.","People send greetings, jokes, love messages, and even news.","Some even call us the texting capital of the world."]}]);
const tvMenu=()=>menu("TV","What do you want to watch?",[
  {t:"Noontime variety shows",l:["Shows like Eat Bulaga!, Wowowee, and It’s Showtime fill the lunch hour.","There are dance numbers, games, and big prizes. Families, barangay halls, and eateries all gather to watch.","Viewers can even join the games by sending a text message."]},
  {t:"Fantaserye",l:["Fantaserye mixes fantasy with melodrama. Encantadia and Mulawin are big hits.","Costumes and computer effects are new for local TV, so everyone is talking about them."]},
  {t:"Cartoons and anime",l:["After school, kids rush home to watch Pokémon, Dragon Ball Z, Naruto, and Cartoon Network shows.","Many are dubbed in Filipino or English. Kids trade cards and act out the attacks on the playground."]},
  {t:"Asianovela",l:["Taiwanese and Korean dramas are everywhere. Meteor Garden made F4 super famous.","Fans copy the hairstyles and fashion. Some say this is only the beginning of Asian dramas in the Philippines."]}]);
const pcMenu=()=>menu("Computer","The computer is free. What do you want to look up?",[
  {t:"Internet cafés",l:["Internet cafés are the new hangout spot. People pay by the hour to browse, chat, and play.","Many students come after school, and some stay until late at night."]},
  {t:"Online games",l:["Ragnarok Online, DotA, and Counter-Strike are huge. Friends team up here and play together.","Some even play with people from other places."]},
  {t:"Social sites",l:["Friendster profiles with testimonials were a big thing, and now many people are moving to Facebook.","Social sites are a new way to show who you are online."]}]);
S.block1={pal:0,w:38,h:15,
  m:mk(38,15,"g",[["t",0,0,38,1],["t",0,14,38,1],["p",0,6,38,4],
   ["U",4,2,8,1],["H",4,3,8,3],["Q",7,5],["C",10,5],
   ["U",15,2,8,1],["H",15,3,8,3],["D",18,5],
   ["U",26,2,8,1],["H",26,3,8,3],["D",29,5],
   ["l",13,11],["l",24,11],["t",3,12],["t",35,12],["t",20,12],["b",8,12],["b",30,12]]),
  warps:{"18,5":["lolaHouse",9,10,"u"],"29,5":["cafe",9,10,"u"]},
  labels:[{x:8,y:2.75,t:"ATE MELODY’S STORE"},{x:19,y:2.75,t:"LOLA ROSA’S HOUSE"},{x:30,y:2.75,t:"INTERNET CAFÉ"}],
  left:"street",noRight:"The road keeps going, but this part of the game is still being built.",
  npcs:[
   {x:2,y:7,k:"sign",n:"Sign",f:()=>talk("Sign",["Don’t forget to check the calendar in each area!","Every place has one that tells you its year."])},
   {x:5,y:7,d:"r",l:L.c1,n:"Jun",f:()=>talk("Jun",["Texting is so cheap now! I send more than fifty messages a day.","My friends and I even have txtmates we have never met.","Ask Ate Melody for more information."])},
   {x:9,y:7,d:"l",l:L.c2,n:"Ramon",f:()=>talk("Ramon",["Everyone at school has a Nokia now. Some even have colored covers!","Everybody buys their prepaid load here.","Ask Ate Melody for more information."])},
   {x:7,y:5,k:"obj",f:()=>{if(!G.flags.met){G.flags.met=1;talk("Ate Melody",["Oh, hello there! Come closer to the window, I can hear you from here."],storeMenu)}else storeMenu()}},
   calObj(10,5,2000,"A whole new millennium!")]};
S.lolaHouse={pal:0,w:20,h:15,
  m:mk(20,15,".",ROOM.concat([["C",9,2],["Y",12,2],["V",11,3],["A",15,3],["K",7,3],["R",10,4,4,2],["O",11,6,2,1],["E",5,8],["X",6,8,2,1],["E",8,8],["P",4,10],["P",15,8],["M",10,10]])),
  warps:{"9,11":["block1",18,6,"d"]},
  npcs:[{x:8,y:6,d:"d",l:L.rosa,n:"Lola Rosa",f:()=>talk("Lola Rosa",["Hello, apo! Do you want to watch TV?","Press the button on that old television. Many good shows are on today!"])},
   calObj(9,2,2005,"Reality shows and fantaserye are everywhere."),
   {x:11,y:3,k:"obj",f:tvMenu}]};
S.cafe={pal:0,w:20,h:15,
  m:mk(20,15,".",ROOM.concat([["G",5,3],["G",7,3],["G",9,3],["G",11,3],["G",5,6],["G",7,6],["G",9,6],["C",14,2],["P",15,3],["P",4,10],["P",15,10]])),
  warps:{"9,11":["block1",29,6,"d"]},
  npcs:[kid(5,4,0,"I’m on level 80 in Ragnarok! Don’t bother me!"),
   kid(7,4,1,"Shh, I’m in the middle of a DotA match."),
   kid(9,4,2,"My cousins and I play Counter-Strike here every Saturday."),
   kid(5,7,3,"I’m updating my Friendster page. Look at all my testimonials!"),
   kid(7,7,4,"The rental is by the hour, so I’m watching the clock."),
   kid(9,7,0,"I’m checking Facebook. It feels like everyone is on it now."),
   {x:14,y:6,d:"l",l:L.rey,n:"Kuya Rey",f:()=>talk("Kuya Rey",["Welcome to the internet café! We rent computers by the hour.","All the computers are taken except the one in the corner. Go ahead and try it!"])},
   {x:11,y:3,k:"obj",f:pcMenu},
   calObj(14,2,2010,"Facebook and mobile phones are changing everything.")]};
S.credits={pal:0,w:20,h:15,
  m:mk(20,15,"g",[["t",0,0,20,1],["t",0,14,20,1],["p",0,7,20,2],["t",3,3],["t",16,3],["t",3,11],["t",16,11]]),
  right:"hood",enter:creditsTalk,
  npcs:[{x:10,y:6,k:"sign",n:"Sign",f:creditsTalk}]};
function creditsTalk(){talk("Credits",["Tracing the Pop! Digital Museum","Made by Group 13","Jessyryll Jane Irudistan","Angel Jet Advincula","Sources: (to be added)","Thanks for playing! Walk right to return to the start of the journey."])}
function momTalk(){
  if(G.flags.load){$("hud").style.display="none";talk("Mom",["You got the load! Thank you, sweetie.","Now I can finally text your Tita about the weekend."]);return}
  const first=!G.flags.asked;G.flags.asked=1;
  setGoal("Buy prepaid load at Ate Melody’s store (walk right).");
  talk("Mom",first?["Good morning, sweetie! Could you do me a favor?","Please buy some prepaid load for my phone at Ate Melody’s store. I need to text your Tita about the weekend.","Go outside and walk to the right. It’s a little far, so take your time!"]:["Ate Melody’s store is down the road to the right.","Take your time, sweetie!"]);
}

/* ===== STATE ===== */
const G={sc:"home",p:{tx:9,ty:9,nx:9,ny:9,t:0,mv:false,d:"u"},mode:"play",flags:{},fade:0,q:[],sel:0};
const held=[];

/* ===== DIALOGUE ===== */
let typing=null;
function setGoal(t){const h=$("hud");h.textContent="Goal: "+t;h.style.display="block"}
function show(name){$("dlg").style.display="block";$("nm").textContent=name}
function talk(name,lines,done){G.mode="talk";G.q=lines.slice();G.nm=name;G.done=done||null;nextLine()}
function nextLine(){
  if(!G.q.length){end();return}
  show(G.nm);$("ch").innerHTML="";$("hint").style.display="none";
  G.full=G.q.shift();G.i=0;$("tx").textContent="";clearInterval(typing);
  typing=setInterval(()=>{G.i++;$("tx").textContent=G.full.slice(0,G.i);if(G.i>=G.full.length)finish()},22);
}
function finish(){clearInterval(typing);G.i=G.full.length;$("tx").textContent=G.full;$("hint").style.display="block"}
function end(){clearInterval(typing);$("dlg").style.display="none";G.mode="play";const d=G.done;G.done=null;if(d)d()}
function choose(name,prompt,opts){
  G.mode="choose";G.opts=opts;G.sel=0;show(name);clearInterval(typing);
  $("tx").textContent=prompt;$("hint").style.display="none";renderChoices();
}
function renderChoices(){
  const box=$("ch");box.innerHTML="";
  G.opts.forEach((o,i)=>{
    const b=document.createElement("button");b.textContent=o.t;b.className=i===G.sel?"sel":"";
    b.onmouseenter=()=>setSel(i);b.onclick=e=>{e.stopPropagation();pick(i)};box.appendChild(b);
  });
}
function setSel(i){G.sel=i;[...$("ch").children].forEach((b,j)=>{b.className=j===i?"sel":""})}
function pick(i){const o=G.opts[i];$("ch").innerHTML="";$("tx").textContent="";o.f()}
function menu(n,p,items){choose(n,p,items.map(i=>({t:i.t,f:()=>{if(i.a)i.a();talk(n,i.l,()=>menu(n,p,items))}})).concat([{t:"Bye!",f:end}]))}

/* ===== MOVEMENT ===== */
function solidAt(sc,x,y){return SOLID.includes(sc.m[y][x])}
function npcAt(sc,x,y){return (sc.npcs||[]).find(n=>n.x===x&&n.y===y)}
function go(id,x,y,d){
  G.sc=id;document.documentElement.style.setProperty("--ac",S[id].ac||"#ffd84a");const p=G.p;p.tx=p.nx=x;p.ty=p.ny=y;p.d=d;p.mv=false;p.t=0;G.fade=1;
  const sc=S[id];if(sc.enter)sc.enter();
}
function tryMove(d){
  const p=G.p,sc=S[G.sc];p.d=d;
  const nx=p.tx+V[d][0],ny=p.ty+V[d][1];
  if(nx<0||nx>=sc.w){
    const to=nx<0?sc.left:sc.right;
    if(to)go(to,nx<0?S[to].w-1:0,p.ty,d);
    else if(nx>=sc.w&&sc.noRight){held.length=0;talk("",[sc.noRight])}
    return;
  }
  if(ny<0||ny>=sc.h||solidAt(sc,nx,ny)||npcAt(sc,nx,ny))return;
  p.nx=nx;p.ny=ny;p.mv=true;p.t=0;
}
function arrive(){
  const sc=S[G.sc],w=sc.warps&&sc.warps[G.p.tx+","+G.p.ty];
  if(w)go(w[0],w[1],w[2],w[3]);
}
function update(dt){
  const p=G.p;
  if(G.fade>0)G.fade-=dt*3;
  if(p.mv){p.t+=dt/0.16;if(p.t>=1){p.tx=p.nx;p.ty=p.ny;p.mv=false;p.t=0;arrive()}}
  if(!p.mv&&G.mode==="play"&&held.length)tryMove(held[held.length-1]);
}
function act(){
  if(G.mode==="talk"){if(G.i<G.full.length)finish();else nextLine();return}
  if(G.mode==="choose"){pick(G.sel);return}
  const p=G.p,sc=S[G.sc];if(p.mv)return;
  const n=npcAt(sc,p.tx+V[p.d][0],p.ty+V[p.d][1]);
  if(n){if(!n.k)n.d=OPP[p.d];n.f()}
}

/* ===== DRAWING ===== */
function tile(ch,x,y,tx,ty){
  const h=(tx*7+ty*13)%11,P=PAL;
  const f=(col,a,b,w,hh)=>{c.fillStyle=col;c.fillRect(x+a,y+b,w,hh)};
  if(ch==="."){f("#000",0,0,16,16);return}
  if(ch==="Q"){f("#e9c98a",0,0,16,16);f("#c8312b",0,0,16,3);f("#fff",0,0,4,3);f("#fff",8,0,4,3);f("#7a4a24",1,3,14,12);f("#222",3,5,10,9);f("#2a1a12",5,5,6,2);f("#e8b88a",6,7,4,4);f("#e0533a",4,11,8,3);return}
  if("gtblS".includes(ch)){
    f(P.g,0,0,16,16);
    if(h%3===0)f(P.g2,3,4,2,1);if(h%4===1)f(P.g2,10,11,2,1);
    if(h===1)f(P.fl[0],8,9,2,2);if(h===5)f(P.fl[1],4,10,2,2);if(h===8)f(P.fl[2],11,5,2,2);
  }
  if(ch==="p"){f(P.p,0,0,16,16);f(P.p2,0,7,16,1);f(P.p2,ty%2?4:10,0,1,8);f(P.p2,ty%2?10:4,8,1,8)}
  if(ch==="t"){f("#7a4a24",6,10,4,5);f("#2f7a34",2,1,12,10);f("#3f9a44",3,2,10,8);f("#6fc46c",5,3,3,2)}
  if(ch==="b"){f("#7a4a24",2,10,2,4);f("#7a4a24",12,10,2,4);f("#b9722f",1,6,14,4);f("#d99a58",1,6,14,1)}
  if(ch==="l"){f("#333",7,5,2,10);f("#555",5,13,6,2);f("#ffe27a",5,1,6,5);f("#fff6c0",6,2,2,2)}
  if(ch==="U"){f("#b33a3a",0,0,16,16);f("#8f2a2a",0,5,16,1);f("#8f2a2a",0,11,16,1)}
  if(ch==="H"){f("#e9c98a",0,0,16,16);f("#cfa966",0,7,16,1);f("#8ac4e8",4,3,8,5)}
  if("FRBTDWNOVKPYCXEAMG".includes(ch)){
    if("WNCY".includes(ch)){f("#e8d9b5",0,0,16,16);f("#cbb98f",0,13,16,3)}
    else{f("#c99a63",0,0,16,16);f("#b3834f",0,7,16,1)}
    if(ch==="N"){f("#8ac4e8",3,3,10,7);f("#c0453f",2,2,3,9);f("#c0453f",11,2,3,9)}
    if(ch==="C"){f("#fff",3,2,10,11);f("#d33",3,2,10,3);f("#333",5,7,6,1);f("#333",5,9,6,1)}
    if(ch==="Y"){f("#7a4a24",3,3,10,9);f("#9ad0e8",4,4,8,7);f("#e8b88a",6,6,2,2);f("#e8b88a",9,6,2,2)}
    if(ch==="O"){f("#6a2a2a",0,6,2,8);f("#6a2a2a",14,6,2,8);f("#8a3a3a",1,4,14,10);f("#a24c4c",1,4,14,3)}
    if(ch==="V"){f("#444",1,3,14,11);f("#111",3,5,10,7);f(Math.sin(TM*6)>0?"#6aa8c8":"#8ac0d8",4,6,8,5);f("#222",5,0,1,3);f("#222",10,0,1,3)}
    if(ch==="K"){f("#7a4a24",1,1,14,14);f("#c0453f",3,3,2,4);f("#3a78d8",5,3,2,4);f("#f2b630",7,3,2,4);f("#2e7d4f",9,3,2,4);f("#5a3a1a",2,8,12,1);f("#9a6ab0",3,10,2,4);f("#f1c27d",6,10,3,4);f("#d9577a",10,10,2,4)}
    if(ch==="P"){f("#a0522d",5,10,6,5);f("#2f7a34",3,2,10,9);f("#3f9a44",5,3,6,5)}
    if(ch==="X"){f("#8a5a3b",0,4,16,9);f("#a87348",0,4,16,2);f("#fff",5,7,3,2)}
    if(ch==="E"){f("#a07040",3,6,10,6);f("#7a4a24",3,12,2,3);f("#7a4a24",11,12,2,3)}
    if(ch==="A"){f("#888",7,10,2,5);f("#aaa",3,3,10,8);if(Math.floor(TM*8)%2)f("#eee",2,7,12,2);else f("#eee",7,2,2,12)}
    if(ch==="M"){f("#3a78d8",3,9,3,5);f("#3a78d8",9,9,3,5)}
    if(ch==="G"){f("#6a5a4a",0,8,16,7);f("#222",2,1,12,9);f(Math.sin(TM*4+tx)>0?"#4ac0e8":"#2a90c0",3,2,10,7);f("#ddd",5,12,6,2)}
    if(ch==="R")f("#c0453f",1,1,14,14);
    if(ch==="B"){f("#4a6ab8",0,2,16,13);f("#fff",1,3,5,4)}
    if(ch==="T"){f("#8a5a3b",0,3,16,10);f("#a87348",0,3,16,2)}
    if(ch==="D"){f("#7a4a24",3,0,10,16);f("#ffd84a",10,8,2,2)}
  }
}
function person(x,y,o,d,fr,bo){
  const f=(col,a,b,w,h)=>{c.fillStyle=col;c.fillRect(x+a,y+b,w,h)};
  f("rgba(0,0,0,.25)",3,14,10,2);
  f(o.p,4,12,3,4-(fr===1?1:0));f(o.p,9,12,3,4-(fr===2?1:0));
  c.save();c.translate(0,bo||0);
  f(o.t,3,8,10,5);f(o.t,2,8,2,4);f(o.t,12,8,2,4);f(o.s,2,12,2,1);f(o.s,12,12,2,1);
  f(o.s,4,1,8,8);
  if(d==="u"){f(o.h,4,0,8,o.long?11:8)}
  else{
    f(o.h,4,0,8,3);f(o.h,3,1,1,3);f(o.h,12,1,1,3);
    if(o.long){f(o.h,3,3,1,8);f(o.h,12,3,1,8)}
    if(d==="l")f(o.h,8,2,4,o.long?9:6);
    if(d==="r")f(o.h,4,2,4,o.long?9:6);
    if(d==="d"){f("#222",6,5,1,2);f("#222",9,5,1,2)}
    if(d==="l")f("#222",5,5,1,2);
    if(d==="r")f("#222",10,5,1,2);
  }
  if(o.band)f("#f2c230",4,3,8,1);c.restore();
}
function sign(x,y){c.fillStyle="#7a4a24";c.fillRect(x+7,y+8,2,7);c.fillStyle="#b9722f";c.fillRect(x+2,y+2,12,7);c.fillStyle="#7a4a24";c.fillRect(x+4,y+4,8,1);c.fillRect(x+4,y+6,6,1)}
function draw(){
  const sc=S[G.sc],p=G.p;PAL=PALS[sc.pal];
  c.fillStyle="#000";c.fillRect(0,0,cv.width,cv.height);
  const ix=p.mv?p.tx+(p.nx-p.tx)*p.t:p.tx,iy=p.mv?p.ty+(p.ny-p.ty)*p.t:p.ty;
  const cx=Math.max(0,Math.min(sc.w*T-cv.width,ix*T+8-cv.width/2)),cy=Math.max(0,Math.min(sc.h*T-cv.height,iy*T+8-cv.height/2));
  c.save();c.translate(-Math.round(cx),-Math.round(cy));
  for(let y=0;y<sc.h;y++)for(let x=0;x<sc.w;x++)tile(sc.m[y][x],x*T,y*T,x,y);
  (sc.labels||[]).forEach(l=>{c.font="bold 8px Courier New,monospace";c.textAlign="center";c.fillStyle="#000";c.fillText(l.t,l.x*T+1,l.y*T+1);c.fillStyle="#fff";c.fillText(l.t,l.x*T,l.y*T)});
  const ents=(sc.npcs||[]).map(n=>({y:n.y,n}));ents.push({y:iy,me:1});
  ents.sort((a,b)=>a.y-b.y).forEach(e=>{
    if(e.me){person(Math.round(ix*T),Math.round(iy*T),L.me,p.d,p.mv?(p.t<.5?1:2):0,p.mv?0:br(0))}
    else if(e.n.k==="sign")sign(e.n.x*T,e.n.y*T);
    else if(e.n.k==="obj"){}
    else person(e.n.x*T,e.n.y*T,e.n.l,e.n.d,0,br(e.n.x*1.7+e.n.y*2.3));
  });
  c.restore();
  if(G.fade>0){c.fillStyle="rgba(0,0,0,"+Math.min(1,G.fade)+")";c.fillRect(0,0,cv.width,cv.height)}
}
let last=0,TM=0;
function br(ph){return Math.sin(TM*2.2+ph)>0.15?1:0}
function loop(t){const dt=Math.min((t-last)/1000,.05);last=t;TM=t/1000;update(dt);draw();requestAnimationFrame(loop)}

/* ===== INPUT ===== */
const KM={w:"u",arrowup:"u",s:"d",arrowdown:"d",a:"l",arrowleft:"l",d:"r",arrowright:"r"};
function press(d){
  if(G.mode==="choose"){if(d==="u")setSel((G.sel+G.opts.length-1)%G.opts.length);if(d==="d")setSel((G.sel+1)%G.opts.length);return}
  const i=held.indexOf(d);if(i>-1)held.splice(i,1);held.push(d);
}
function release(d){const i=held.indexOf(d);if(i>-1)held.splice(i,1)}
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();
  if(KM[k]){if(!e.repeat)press(KM[k])}
  else if(e.repeat)return;
  else if(k==="e"||k===" "||k==="enter")act();
  else if(G.mode==="choose"&&/^[1-9]$/.test(k)&&G.opts[+k-1])pick(+k-1);
});
addEventListener("keyup",e=>{const d=KM[e.key.toLowerCase()];if(d)release(d)});
addEventListener("blur",()=>{held.length=0});
$("game").addEventListener("click",()=>{if(G.mode!=="choose")act()});
document.querySelectorAll("#dp button").forEach(b=>{
  b.addEventListener("pointerdown",e=>{e.preventDefault();press(b.dataset.k)});
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>release(b.dataset.k)));
});
$("abtn").addEventListener("pointerdown",e=>{e.preventDefault();act()});

/* ===== START ===== */
talk("Welcome",["Welcome to Tracing the Pop! Digital Museum.","Move with W, A, S, D or the arrow keys. Press E, Space, Enter, or click to talk and interact.","Talk to everyone you meet, and remember you can always walk back to the left."]);
requestAnimationFrame(loop);
</script>
