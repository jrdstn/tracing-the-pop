<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Game Museum</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>
  <div id="hud"></div>
  <div id="dlg"><div id="pic"></div><div id="nm"></div><div id="tx"></div><div id="ch"></div><div id="hint">▼</div></div>
  <div id="title" class="ov"></div>
  <div id="cred" class="ov" style="display:none"></div>
  <div id="pause" class="ov" style="display:none"></div>
  <div id="help" class="ov" style="display:none"></div>
</div>
<div id="pad">
  <div id="dp"><span></span><button data-k="u">▲</button><span></span><button data-k="l">◀</button><span></span><button data-k="r">▶</button><span></span><button data-k="d">▼</button><span></span></div>
  <button id="abtn">A</button>
  <button id="mbtn">☰</button>
</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
